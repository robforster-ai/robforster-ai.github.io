<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/cyberpunk.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Cloudflare Web Analytics -->
<script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "06993a8dc6854cc08431a49477874d82"}'></script>

<!-- Favicons -->
<link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

<!-- Open Graph -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Rob Forster | Enterprise AI">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | Rob Forster{% else %}Rob Forster | Enterprise AI Transformation Lead{% endif %}">
<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% elsif page.description %}{{ page.description }}{% else %}Practitioner writing on enterprise AI transformation, programme delivery and the gap between what technology promises and what it takes to make it real.{% endif %}">
<meta property="og:image" content="{% if page.layout == 'post' %}{{ site.url }}/assets/img/og/{{ page.slug }}.png{% else %}{{ site.url }}/assets/img/og-default.png{% endif %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_GB">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | Rob Forster{% else %}Rob Forster | Enterprise AI Transformation Lead{% endif %}">
<meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 160 }}{% elsif page.description %}{{ page.description }}{% else %}Practitioner writing on enterprise AI transformation.{% endif %}">

{% if page.layout == 'post' %}
<meta property="article:author" content="Rob Forster">
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{% if page.category %}<meta property="article:section" content="{{ page.category }}">{% endif %}
{% endif %}
