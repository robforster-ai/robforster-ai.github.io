---
layout: default
---
<main>
  <div class="container">
    <div class="post-header">
      {% if page.category %}<span class="tag">{{ page.category }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      <div class="post-meta-row">
        <span>// {{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.read_time %}
        <span class="divider"></span>
        <span>{{ page.read_time }}</span>
        {% endif %}
      </div>
    </div>

    <article class="post-body">
      {{ content }}
    </article>

    <div class="post-back">
      <a href="{{ '/writing' | relative_url }}">&larr; back_to_archive.log</a>
    </div>
  </div>
</main>
